name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same ref cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor declared in `engines`; 22 is current LTS.
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4   # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test -- --ci --coverage

      - name: Upload coverage
        if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  audit:
    name: audit (prod deps, high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4   # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run audit

  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    # Only PRs: pushes to main may contain already-merged history.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install commitlint
        run: npm install --no-save @commitlint/cli@^19 @commitlint/config-conventional@^19

      - name: Lint commit messages in this PR
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  consumer-smoke:
    name: consumer smoke (mini-app)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4   # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Build and pack the toolkit
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm pack --pack-destination /tmp

      # The mini-app has no committed lockfile on purpose: it installs against
      # the tarball packed above, not a pinned resolution.
      - name: Install mini-app against the packed tarball
        working-directory: examples/mini-app
        run: |
          pnpm install --no-frozen-lockfile
          pnpm add "$(ls /tmp/alaska115-nextjs-toolkit-*.tgz)"

      # Every subpath must load with only the required peers present. Optional
      # peers that get statically imported break this, and the failure only
      # shows up outside the repo — pnpm's autoInstallPeers hides it in-tree.
      - name: Assert every subpath loads
        working-directory: examples/mini-app
        run: |
          for s in "" audit bootstrap cache config context errors feature-flags \
                   health messaging multi-tenancy observability outbox persistence \
                   rate-limit resilience secret security shutdown utils; do
            p="@alaska115/nextjs-toolkit${s:+/$s}"
            if node -e "require('$p')" 2>/tmp/err; then
              echo "OK    ${s:-<root>}"
            else
              echo "FAIL  ${s:-<root>}"; cat /tmp/err; exit 1
            fi
          done

      - name: Smoke test
        working-directory: examples/mini-app
        run: pnpm run smoke
